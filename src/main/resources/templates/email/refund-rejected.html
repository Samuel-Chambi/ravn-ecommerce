<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{email/base :: layout(~{::content})}">

<body>
    <div th:fragment="content">
        <h2>Refund Request Update</h2>
        <p>Hello <span th:text="${email}">User</span>,</p>
        <p>We regret to inform you that your refund request for order <strong>#<span
                    th:text="${orderId}">12345</span></strong> has been <span
                style="color: #e53935; font-weight: bold;">rejected</span>.</p>
        <div th:if="${adminNote != null and !adminNote.isEmpty()}"
            style="background-color: #f5f5f5; border-left: 4px solid #e53935; padding: 12px 16px; margin: 16px 0;">
            <p style="margin: 0; font-weight: bold;">Manager's note:</p>
            <p style="margin: 4px 0 0 0;" th:text="${adminNote}">Reason for rejection</p>
        </div>
        <p>If you have any questions or believe this decision was made in error, please contact our support team.</p>
    </div>
</body>

</html>
