<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{email/base :: layout(~{::content})}">
<body>
    <div th:fragment="content">
        <h2>Password Changed Successfully</h2>
        <p>Hello <span th:text="${email}">User</span>,</p>
        <p>This email confirms that your password for Ravn Ecommerce was changed on <strong th:text="${date}">Date</strong>.</p>
        <p>If you did not make this change, please contact our support team immediately.</p>
        <p>
            <a href="#" class="button">Contact Support</a>
        </p>
    </div>
</body>
</html>
