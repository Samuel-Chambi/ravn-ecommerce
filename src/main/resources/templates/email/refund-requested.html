<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{email/base :: layout(~{::content})}">
<body>
    <div th:fragment="content">
        <h2>New Refund Request</h2>
        <p>Hello Manager,</p>
        <p>A new refund request has been submitted and requires your review:</p>
        <table style="border-collapse: collapse; width: 100%; margin: 16px 0;">
            <tr>
                <td style="padding: 8px; font-weight: bold; border: 1px solid #ddd;">Refund ID</td>
                <td style="padding: 8px; border: 1px solid #ddd;" th:text="${refundId}">#123</td>
            </tr>
            <tr>
                <td style="padding: 8px; font-weight: bold; border: 1px solid #ddd;">Order ID</td>
                <td style="padding: 8px; border: 1px solid #ddd;" th:text="${orderId}">#456</td>
            </tr>
            <tr>
                <td style="padding: 8px; font-weight: bold; border: 1px solid #ddd;">User ID</td>
                <td style="padding: 8px; border: 1px solid #ddd;" th:text="${userId}">789</td>
            </tr>
            <tr>
                <td style="padding: 8px; font-weight: bold; border: 1px solid #ddd;">Reason</td>
                <td style="padding: 8px; border: 1px solid #ddd;" th:text="${reason}">Damaged item</td>
            </tr>
        </table>
        <p>Please review this request in the admin panel.</p>
    </div>
</body>
</html>
