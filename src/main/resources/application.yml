app:
  jwt:
    secret: ${JWT_SECRET:your-secret-key-must-be-at-least-32-characters-long}
    expiration: 86400000  # 24 hours

  email:
    from: ${EMAIL_FROM:noreply@ecommerce.com}
    host: ${EMAIL_HOST:smtp.gmail.com}
    port: ${EMAIL_PORT:587}
    username: ${EMAIL_USERNAME:your-email@gmail.com}
    password: ${EMAIL_PASSWORD:your-password}

  storage:
    type: ${STORAGE_TYPE:local}
    local:
      upload-dir: ${UPLOAD_DIR:./uploads}
    s3:
      bucket: ${S3_BUCKET:}
      region: ${S3_REGION:us-east-1}

  rate-limit:
    requests: ${RATE_LIMIT_REQUESTS:5}
    window-seconds: ${RATE_LIMIT_WINDOW:3600}

  stripe:
    api-key: ${STRIPE_API_KEY:sk_test_xxxxx}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_xxxxx}

spring:
  application:
    name: ecommerce-api

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ecommerce}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always