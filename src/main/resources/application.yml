app:
  jwt:
    secret: ${JWT_SECRET:your-secret-key-must-be-at-least-32-characters-long}
    expiration: 86400000  # 24 hours
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
    allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,PATCH,OPTIONS}
    allowed-headers: ${CORS_ALLOWED_HEADERS:*}

  email:
    enabled: true
    from: ${EMAIL_FROM:noreply@ecommerce.com}
    host: ${EMAIL_HOST:localhost}
    port: ${EMAIL_PORT:587}
    username: ${EMAIL_USERNAME:disabled}
    password: ${EMAIL_PASSWORD:disabled}

  storage:
    type: ${STORAGE_TYPE:s3}
    local:
      upload-dir: ${UPLOAD_DIR:./uploads}
    s3:
      bucket: ${AWS_S3_BUCKET:ravn-ecommerce-product-images}
      region: ${AWS_REGION:us-east-2}
      access-key: ${AWS_ACCESS_KEY_ID}
      secret-key: ${AWS_SECRET_ACCESS_KEY}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

  rate-limit:
    requests: ${RATE_LIMIT_REQUESTS:3}
    window-seconds: ${RATE_LIMIT_WINDOW:3600}

  stripe:
    api-key: ${STRIPE_API_KEY:sk_test}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:secret}

spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:default}
      password: ${REDIS_PASSWORD:}

  mail:
    host: ${EMAIL_HOST:smtp.gmail.com}
    port: ${EMAIL_PORT:587}
    username: ${EMAIL_USERNAME}
    password: ${EMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
  application:
    name: ecommerce-api

  datasource:
    url: ${DATABASE_URL:postgres.url}
    username: ${DATABASE_USERNAME:user}
    password: ${DATABASE_PASSWORD:user}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true

  graphql:
    graphiql:
      enabled: true
    path: /graphql

server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always